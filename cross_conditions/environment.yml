name: vsbench_dock
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - matplotlib
  - rdkit=2023.09.1
  - openbabel
  - pip
  - pip:
      - meeko
# Uni-Dock 1.1.3 is not on conda-forge for every platform. Install the released binary:
#   wget https://github.com/dptech-corp/Uni-Dock/releases/download/1.1.3/unidock -O ~/bin/unidock
#   chmod +x ~/bin/unidock && export UNIDOCK_BIN=~/bin/unidock
# Verify the build runs on the node's GPUs before the full run (run_cross_conditions.py --check).
# Record the exact binary version and CUDA driver in the manifest for the Methods section.
